<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{layout :: layout (~{::body})}">

  <body>

    <div class="container form-table text-center">
      <h2 th:text="#{admin.title}">member table</h2>

      <div class="mt-5">
        <table class="table table-striped table-bordered table-hover table-sm">
          <thead>
            <tr class="table-primary">
              <th class="th-width" th:text="#{admin.member.id}"></th>
              <th class="th-width" th:text="#{admin.member.name}"></th>
              <th class="th-width" th:text="#{admin.member.birthday}"></th>
              <th class="th-width" th:text="#{admin.member.bloodtype}"></th>
              <th class="th-width" th:text="#{admin.member.prefecture}"></th>
              <th class="th-width" th:text="#{admin.member.generation}"></th>
              <th class="th-width" th:text="#{admin.member.active} + '/' + #{admin.member.og}"></th>
              <th class="th-width"></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="member: ${form}">
              <td th:text="${member.id}"></td>
              <td th:text="${member.name}"></td>
              <td th:text="${member.birthday}"></td>
              <td th:text="${member.bloodtype}"></td>
              <td th:text="${member.prefecture}"></td>
              <td th:text="${member.generation}"></td>
              <td th:text="${member.active}"></td>
              <td>
                <div class="d-flex gap-2">
                  <form class="w-100">
                    <th:block th:replace="~{fragments/nogiButton::template(
                          'post', @{/admin/edit(id=${member.id})}, #{admin.edit}, false)}">
                    </th:block>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>

      </div>

      <div class="mt-5">
        <th:block th:replace="~{fragments/pagination::pagination ('/admin/page', ${pageable})}">
        </th:block>
      </div>

      <div class="mt-5">
        <form>
          <th:block th:replace="~{fragments/nogiButton::template(
                'post', '/admin/add', #{admin.add}, true)}">
          </th:block>
        </form>
      </div>

    </div>
  </body>

</html>
