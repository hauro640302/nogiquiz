<!DOCTYPE html>
<html th:fragment="layout (content)" xmlns:th="https://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>

    <link href="https://googleapis.com/css2?family=Kosugi+Maru&family=Mochiy+Pop+One&display=swap"
      rel="stylesheet">

    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <title>NogiQuiz</title>
  </head>

  <body class="d-flex flex-column min-vh-100">

    <!-- header -->
    <header class="bg-nogizaka text-white py-3 position-relative">

      <div class="container-fluid d-flex align-items-center justify-content-center">
        <h1 class="m-0 fs-4 text-center" th:text="#{layout.header.title}">Quiz</h1>

        <!-- ログイン中のみ表示 -->
        <div sec:authorize="isAuthenticated()"
          class="position-absolute end-0 me-3 d-flex align-items-center gap-3">
          <!-- プレーヤー名 -->
          <span class="small d-none d-sm-inline"
            th:text="#{layout.header.welcom(${#authentication.name})}">
            Welcom <span sec:authentication="name"></span> ...
          </span>
          <!-- 管理画面ボタン（管理者のみ表示）-->
          <div sec:authorize="hasAuthority('SUPERUSER')">
            <form>
              <th:block
                th:replace="
                ~{fragments/nogiButton::template('get', '/admin', #{layout.header.admin}, false)}">
              </th:block>
            </form>
          </div>
          <!-- ログアウトボタン -->
          <form>
            <th:block
              th:replace="
              ~{fragments/nogiButton::template('post', '/login/logout/pre', #{layout.header.logout}, false)}">
            </th:block>
          </form>
        </div>
      </div>

    </header>

    <!-- main -->
    <main class="flex-grow-1 bg-nogizaka-subtle py-5">
      <th:block th:insert="${content}" />
    </main>

  </body>

</html>
